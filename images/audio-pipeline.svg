<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 764" width="640" height="764" font-family="'DM Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Audio pipeline for The Unraveling</title>
  <desc id="d">C# gameplay scripts and audio components send sound requests through the resource manager to the AudioManager, which routes them to six FMOD channel groups with low-pass and reverb DSPs, then to the speakers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d6475"/>
    </marker>
  </defs>

  <rect width="640" height="764" fill="#faf8f4"/>

  <!-- Row 1: sources -->
  <rect x="20" y="20" width="290" height="90" rx="12" fill="#e2f0ee" stroke="#2f6f6a" stroke-width="2"/>
  <text x="165" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2430">C# gameplay scripts</text>
  <text x="165" y="76" text-anchor="middle" font-size="13" fill="#5d6475">journal, rooms, enemy</text>
  <text x="165" y="94" text-anchor="middle" font-size="13" fill="#5d6475">call audio through script bindings</text>

  <rect x="330" y="20" width="290" height="90" rx="12" fill="#fbe9df" stroke="#e8845a" stroke-width="2"/>
  <text x="475" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2430">AudioComponent + AudioSystem</text>
  <text x="475" y="76" text-anchor="middle" font-size="13" fill="#5d6475">sounds attached to entities</text>
  <text x="475" y="94" text-anchor="middle" font-size="13" fill="#5d6475">play-on-start from scene data</text>

  <!-- arrows to resource manager -->
  <line x1="165" y1="110" x2="165" y2="148" stroke="#5d6475" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="475" y1="110" x2="475" y2="148" stroke="#5d6475" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: resource manager -->
  <rect x="120" y="150" width="400" height="56" rx="12" fill="#ffffff" stroke="#5d6475" stroke-width="2"/>
  <text x="320" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2430">Resource Manager</text>
  <text x="320" y="196" text-anchor="middle" font-size="13" fill="#5d6475">audio name &#8594; FMOD sound</text>

  <line x1="320" y1="206" x2="320" y2="244" stroke="#5d6475" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="332" y="231" font-size="12" fill="#5d6475">sound + settings</text>

  <!-- Row 3: AudioManager -->
  <rect x="20" y="246" width="600" height="210" rx="14" fill="#ffffff" stroke="#1f2430" stroke-width="2"/>
  <text x="40" y="276" font-size="17" font-weight="700" fill="#1f2430">AudioManager (C++)</text>
  <text x="600" y="276" text-anchor="end" font-size="13" fill="#5d6475">wraps the FMOD system</text>

  <g font-size="13" fill="#1f2430">
    <rect x="36" y="292" width="280" height="44" rx="10" fill="#faf8f4" stroke="#e7e2d9"/>
    <text x="50" y="319">Play, stop, pause, volume, pitch</text>

    <rect x="324" y="292" width="280" height="44" rx="10" fill="#e2f0ee" stroke="#2f6f6a"/>
    <text x="338" y="319">Low-pass cutoff, faded every frame</text>

    <rect x="36" y="346" width="280" height="44" rx="10" fill="#faf8f4" stroke="#e7e2d9"/>
    <text x="50" y="373">Fade in / fade out (FMOD DSP clock)</text>

    <rect x="324" y="346" width="280" height="44" rx="10" fill="#faf8f4" stroke="#e7e2d9"/>
    <text x="338" y="373">Indoor reverb on / off</text>

    <rect x="36" y="400" width="280" height="44" rx="10" fill="#e2f0ee" stroke="#2f6f6a"/>
    <text x="50" y="427">Crossfade between tracks</text>

    <rect x="324" y="400" width="280" height="44" rx="10" fill="#faf8f4" stroke="#e7e2d9"/>
    <text x="338" y="427">3D listener + moving sound sources</text>
  </g>

  <line x1="320" y1="456" x2="320" y2="494" stroke="#5d6475" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 4: FMOD channel groups -->
  <rect x="20" y="496" width="600" height="170" rx="14" fill="#ffffff" stroke="#2f6f6a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="40" y="526" font-size="16" font-weight="700" fill="#1f2430">FMOD channel groups (6)</text>

  <g font-size="14" font-weight="700" fill="#1f2430">
    <rect x="36" y="542" width="176" height="52" rx="10" fill="#e2f0ee" stroke="#2f6f6a"/>
    <text x="48" y="565">BGM</text>
    <text x="48" y="583" font-size="12" font-weight="500" fill="#2f6f6a">+ low-pass DSP</text>

    <rect x="232" y="542" width="176" height="52" rx="10" fill="#e2f0ee" stroke="#2f6f6a"/>
    <text x="244" y="565">SFX</text>
    <text x="244" y="583" font-size="12" font-weight="500" fill="#2f6f6a">+ reverb DSP</text>

    <rect x="428" y="542" width="176" height="52" rx="10" fill="#faf8f4" stroke="#e7e2d9"/>
    <text x="440" y="573">UI</text>

    <rect x="36" y="604" width="176" height="52" rx="10" fill="#faf8f4" stroke="#e7e2d9"/>
    <text x="48" y="635">Scene</text>

    <rect x="232" y="604" width="176" height="52" rx="10" fill="#faf8f4" stroke="#e7e2d9"/>
    <text x="244" y="635">Ambience crossfade</text>

    <rect x="428" y="604" width="176" height="52" rx="10" fill="#faf8f4" stroke="#e7e2d9"/>
    <text x="440" y="635">Persistent</text>
  </g>

  <line x1="320" y1="666" x2="320" y2="698" stroke="#5d6475" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="210" y="700" width="220" height="44" rx="22" fill="#1f2430"/>
  <text x="320" y="728" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Player's speakers</text>
</svg>
